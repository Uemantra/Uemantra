<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>End Times Tactical — World Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: #111; color: #ccc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ─── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  background: #1a1a1a; border-bottom: 1px solid #333;
  padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
#toolbar h1 { color: #c8a84b; font-size: 14px; letter-spacing: 2px; margin-right: auto; }
#toolbar button { background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 12px; }
#toolbar button:hover { background: #333; color: #ddd; }
#file-input, #folder-input { display: none; }

/* ─── Tab Bar ─────────────────────────────────────────────── */
#tabs {
  background: #151515; border-bottom: 1px solid #333;
  display: flex; flex-shrink: 0;
}
.tab {
  padding: 10px 18px; cursor: pointer; font-size: 13px; color: #777;
  border-bottom: 2px solid transparent; user-select: none;
}
.tab.active { color: #c8a84b; border-bottom-color: #c8a84b; background: #1a1a1a; }
.tab:hover:not(.active) { color: #aaa; background: #1c1c1c; }

/* ─── Main Layout ─────────────────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ─── List Panel ─────────────────────────────────────────── */
#list-panel {
  width: 280px; background: #161616; border-right: 1px solid #2a2a2a;
  display: flex; flex-direction: column; flex-shrink: 0;
}
#list-add-btn {
  margin: 10px; background: #1e3a1e; color: #6a9; border: 1px solid #3a6a3a;
  padding: 8px; cursor: pointer; font-family: inherit; font-size: 13px;
}
#list-add-btn:hover { background: #253a25; }
#list-items { flex: 1; overflow-y: auto; }
.list-item {
  padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #1e1e1e;
  font-size: 13px; color: #999;
}
.list-item:hover { background: #1e1e1e; color: #ccc; }
.list-item.selected { background: #1e2a1e; color: #c8a84b; border-left: 3px solid #c8a84b; }
.list-item small { display: block; color: #555; font-size: 11px; margin-top: 2px; }

/* ─── Form Panel ─────────────────────────────────────────── */
#form-panel { flex: 1; overflow-y: auto; padding: 20px 24px; }
#form-panel h2 { color: #c8a84b; font-size: 16px; margin-bottom: 16px; letter-spacing: 1px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; color: #888; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: #1c1c1c; border: 1px solid #333; color: #ddd;
  padding: 8px 10px; font-family: inherit; font-size: 13px;
}
.form-group input:focus, .form-group select, .form-group textarea:focus {
  outline: 1px solid #c8a84b; border-color: #c8a84b;
}
.form-group input[type=number] { width: 80px; }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-group select { cursor: pointer; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-row .form-group { flex: 1; min-width: 120px; }
.form-section-header {
  color: #666; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  border-bottom: 1px solid #222; padding-bottom: 4px; margin: 20px 0 12px;
}
.btn-primary { background: #1e3a1e; color: #6a9; border: 1px solid #3a6a3a; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 13px; margin-right: 8px; }
.btn-primary:hover { background: #253a25; }
.btn-danger { background: #3a1e1e; color: #c66; border: 1px solid #6a3a3a; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 13px; }
.btn-danger:hover { background: #4a2020; }
.btn-small { padding: 4px 10px; font-size: 12px; }
.placeholder { color: #444; font-size: 14px; padding: 40px; text-align: center; }
.stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stat-item label { font-size: 10px; color: #666; text-transform: uppercase; }
.stat-item input { width: 52px; text-align: center; }

/* ─── Dialogue Tree ───────────────────────────────────────── */
.convo-card { background: #1a1a1a; border: 1px solid #2a2a2a; margin-bottom: 12px; }
.convo-header { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; }
.convo-header:hover { background: #222; }
.convo-body { padding: 14px; border-top: 1px solid #252525; }
.node-card { background: #161616; border: 1px solid #252525; margin-bottom: 8px; padding: 10px 14px; }
.node-card .node-type { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #666; margin-bottom: 6px; }
.node-card.npc-line .node-type { color: #5a8a5a; }
.node-card.player-choice .node-type { color: #5a7aaa; }
.choice-row { background: #1a1a1a; border: 1px solid #222; padding: 8px 12px; margin-bottom: 6px; }
.choice-row label { color: #666; font-size: 11px; }
.add-node-btn { background: #1a2a3a; color: #5a8aaa; border: 1px dashed #3a5a7a; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 12px; width: 100%; }
.add-node-btn:hover { background: #1e3040; }
.on-complete-section { background: #1a1a1e; border: 1px solid #2a2a3a; padding: 12px; margin-top: 12px; }

/* ─── Map Painter ─────────────────────────────────────────── */
.map-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.brush {
  padding: 5px 9px; cursor: pointer; font-size: 12px; border: 1px solid #333;
  background: #1c1c1c; color: #aaa; display: flex; align-items: center; gap: 6px;
}
.brush:hover { background: #252525; }
.brush.active { border-color: #c8a84b; color: #c8a84b; background: #1e1e16; }
.brush .swatch { width: 14px; height: 14px; border: 1px solid #000; display: inline-block; }
.map-grid { display: grid; gap: 0; margin: 8px 0 16px; width: max-content; user-select: none; border: 1px solid #333; }
.map-cell {
  width: 22px; height: 22px; font-size: 11px; line-height: 22px; text-align: center;
  cursor: pointer; position: relative; color: #888; outline: 1px solid #00000040;
}
.map-cell:hover { outline: 1px solid #c8a84b; z-index: 2; }
.map-cell .ent { position: absolute; inset: 0; font-size: 12px; font-weight: bold; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.ent-list { margin-top: 8px; }
.ent-row { background: #161616; border: 1px solid #252525; padding: 8px 10px; margin-bottom: 6px; }
.ent-row .ent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.ent-row .ent-head strong { color: #b9a14a; font-size: 12px; }
.loot-row { display: flex; gap: 6px; margin-bottom: 4px; align-items: flex-end; }

/* ─── Help Panel ─────────────────────────────────────────── */
#help-panel {
  background: #141414; border-top: 1px solid #2a2a2a;
  padding: 10px 16px; flex-shrink: 0; min-height: 56px;
  display: flex; align-items: flex-start; gap: 12px;
}
#help-panel strong { color: #c8a84b; font-size: 12px; white-space: nowrap; }
#help-panel span { color: #777; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>ETT &mdash; CAMPAIGN EDITOR</h1>
  <label style="color:#777;font-size:12px">Campaign&nbsp;id:
    <input type="text" id="campaign-id" value="my_game" oninput="campaignId=this.value.trim()||'my_game'"
      style="background:#1c1c1c;border:1px solid #333;color:#c8a84b;padding:4px 8px;font-family:inherit;font-size:12px;width:160px">
  </label>
  <button onclick="importFolder()">&#x1F4C1; Import Campaign Folder</button>
  <input type="file" id="folder-input" webkitdirectory directory multiple onchange="handleFolderImport(event)">
  <button onclick="importJSON()">&#x1F4C2; Import File(s)</button>
  <input type="file" id="file-input" accept=".json" multiple onchange="handleImport(event)">
  <button onclick="exportAll()">&#x1F4BE; Export Campaign</button>
  <button onclick="saveToLocal()">&#x1F4BB; Save to LocalStorage</button>
  <button onclick="loadFromLocal()">&#x21BA; Load Saved</button>
</div>

<div id="tabs">
  <div class="tab" onclick="switchTab('campaign')">Campaign</div>
  <div class="tab" onclick="switchTab('world')">World</div>
  <div class="tab active" onclick="switchTab('factions')">Factions</div>
  <div class="tab" onclick="switchTab('items')">Items</div>
  <div class="tab" onclick="switchTab('locations')">Locations</div>
  <div class="tab" onclick="switchTab('maps')">Maps</div>
  <div class="tab" onclick="switchTab('npcs')">NPCs</div>
  <div class="tab" onclick="switchTab('quests')">Quests</div>
  <div class="tab" onclick="switchTab('dialogue')">Dialogue</div>
  <div class="tab" onclick="switchTab('perks')">Perks</div>
  <div class="tab" onclick="switchTab('traits')">Traits</div>
</div>

<div id="main">
  <div id="list-panel">
    <button id="list-add-btn" onclick="addItem()">+ Add New</button>
    <div id="list-items"></div>
  </div>
  <div id="form-panel"><div class="placeholder">Select an item from the left, or click &ldquo;+ Add New&rdquo;</div></div>
</div>

<div id="help-panel">
  <strong id="help-title">HELP</strong>
  <span id="help-body">Click any field to see what it does.</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  DATA STORE
// ═══════════════════════════════════════════════════════════════
const DB = {
  manifest: {
    id: 'my_game', name: 'New Campaign', version: '0.1.0', author: 'Your Name', description: '',
    player_start: {
      name: 'Wanderer', location: '',
      stats: { grit:5, reflex:5, mind:5, body:5, nerve:5, presence:5 },
      inventory: [], caps: 25, time_hours: 8,
    },
    default_unarmed_weapon: '',
  },
  factions: {},
  items: { weapons: [], armor: [], consumables: [], misc: [] },
  locations: {},
  maps: {},          // local_maps, keyed by id
  npcs: {},
  dialogues: {},
  quests: {},
  perks: {},         // keyed by id
  traits: {},        // keyed by id
  world: { nodes: [] },
};

// Ordered tab ids — index-aligned with the .tab elements in the DOM.
const TABS = ['campaign','world','factions','items','locations','maps','npcs','quests','dialogue','perks','traits'];

let currentTab = 'factions';
let selectedId = null;
let dialogueNpcId = null;
let campaignId = 'my_game';

// Terrain palette — mirrors scripts/systems/TerrainDB.gd. char is what gets written
// into a map's terrain rows; color is editor-only styling.
const TERRAIN_PALETTE = [
  { id:'floor',         char:'.', color:'#6b5d44', name:'Floor' },
  { id:'road',          char:'r', color:'#4a4a4a', name:'Road' },
  { id:'grass',         char:'g', color:'#46562e', name:'Grass' },
  { id:'interior',      char:'_', color:'#5a4a38', name:'Interior' },
  { id:'cover_partial', char:'o', color:'#7a6a3a', name:'Cover — partial' },
  { id:'cover_full',    char:'O', color:'#8a5a2a', name:'Cover — full' },
  { id:'rubble',        char:'+', color:'#6a5a4a', name:'Rubble' },
  { id:'obstacle',      char:'#', color:'#333333', name:'Obstacle (blocks move+LOS)' },
  { id:'wall',          char:'W', color:'#222222', name:'Wall (blocks move+LOS)' },
  { id:'water',         char:'~', color:'#264a6a', name:'Water (blocks move)' },
  { id:'void',          char:' ', color:'#0a0a0a', name:'Void (no hex)' },
];
const PROP_KINDS = ['shack','house','building','hut','wreck','car','vehicle','tent','fence','barricade','wall_low','campfire','fire','generator','machine','terminal','console','tree','dead_tree','cactus','barrel','crate','sign','chest'];
function charColor(ch) { const t = TERRAIN_PALETTE.find(t => t.char === ch); return t ? t.color : '#6b5d44'; }

// Current map-painter brush.
let mapBrush = { kind: 'terrain', value: 'floor' };

// ═══════════════════════════════════════════════════════════════
//  HELP SYSTEM
// ═══════════════════════════════════════════════════════════════
const HELP = {
  // Manifest
  'manifest-id': ['Campaign ID', 'Folder name for this campaign (lowercase, underscores). The game loads it when this id is the single line in campaigns/active.txt. Changing it here also sets the export target.'],
  'manifest-start_name': ['Character Name', 'The player character\'s default name at the start of a new game.'],
  'manifest-start_location': ['Start Location', 'Which location the player wakes up in. Must be a Location you have defined.'],
  'manifest-start_time': ['Start Time', 'The hour (0–23) on Day 1 when the game begins. 8 = 08:00.'],
  'manifest-default_weapon': ['Default Unarmed Weapon', 'The weapon used in combat when the player has nothing equipped. Usually a fists/pistol fallback.'],
  // Factions
  'faction-id': ['ID', 'Unique machine-readable identifier, e.g. "the_council". Use lowercase, underscores only. Cannot be changed after creation.'],
  'faction-name': ['Name', 'The display name players see in dialogue and the faction rep strip.'],
  'faction-description': ['Description', 'Internal notes about this faction. Useful for writers to understand who they are.'],
  'faction-rep_starting': ['Starting Reputation', 'The player\'s reputation with this faction at the start of a new game. 0 = neutral.'],
  'faction-rep_threshold_hostile': ['Hostile Threshold', 'If rep drops below this value, the faction treats the player as an enemy.'],
  'faction-rep_threshold_friendly': ['Friendly Threshold', 'Rep must reach this value for the faction to be friendly to the player.'],
  'faction-rep_label_0': ['Neutral Label', 'What the player\'s status is called when rep is at zero (e.g. "Outsider", "Civilian").'],
  // NPC
  'npc-name': ['Name', 'The full display name of this NPC, shown in dialogue boxes and location lists.'],
  'npc-faction': ['Faction', 'Which faction this NPC belongs to. Affects faction rep when you interact with them.'],
  'npc-role': ['Role', 'A short description of who this person is. Shown as a tooltip. Helps writers know the character.'],
  'npc-location_default': ['Default Location', 'Which location this NPC can normally be found at.'],
  'npc-stats-grit': ['Grit', 'Affects HP and resistance to bleeding. High grit = tough, hard to kill through attrition.'],
  'npc-stats-reflex': ['Reflex', 'Affects action points per turn, initiative order, and evasion in combat.'],
  'npc-stats-mind': ['Mind', 'Affects Speech, Tech, and Medicine skill bases. Smart characters are better at talking and tech.'],
  'npc-stats-body': ['Body', 'Affects HP, carry weight, and melee damage. Physical strength and stamina.'],
  'npc-stats-nerve': ['Nerve', 'Affects Intimidate and Guns accuracy. Coolness under fire and aggressive precision.'],
  'npc-stats-presence': ['Presence', 'Affects Barter and Speech (secondary). Charm and force of personality.'],
  'npc-has_combat': ['Has Combat Profile', 'Check this if the NPC can appear in tactical combat. If unchecked, they are dialogue-only.'],
  'npc-vendor': ['Vendor / Shop', 'Check this if the NPC can buy and sell with the player. You also need a dialogue line marked "Opens trade/shop" so the player can reach the shop.'],
  'vendor-sells': ['Items For Sale', 'Comma-separated item IDs this NPC stocks (e.g. stimpak, ammo_9mm). The player buys these at base value × markup.'],
  'vendor-markup': ['Price Markup', 'Multiplier on base item value for buying. 1.0 = base price, 1.25 = 25% more expensive. Players always sell back at half base value.'],
  'vendor-buys': ['Buys From Player', 'If checked, the player can sell their own items here. If unchecked, the shop is buy-only.'],
  'node-open_shop': ['Opens Trade/Shop', 'When the player continues past this NPC line, the conversation ends and this NPC\'s shop opens. The NPC must have a Vendor profile set.'],
  // Location
  'location-name': ['Location Name', 'The display name shown on the world map and in the location header.'],
  'location-type': ['Type', '"settlement" = safe hub. "hostile_zone" = combat likely. "dungeon" = structured dungeon encounter.'],
  'location-description': ['Description', 'Shown to the player when they arrive. Set the scene — smell, sounds, first impressions.'],
  'location-ambient': ['Ambient Description', 'Short flavour note used for atmosphere. Writers can use this for creative reference.'],
  // Item
  'item-name': ['Item Name', 'Display name shown in the inventory and during dialogue.'],
  'item-description': ['Description', 'Flavour text shown in the inventory detail view. Write it in-world.'],
  'item-weight': ['Weight (kg)', 'How much this item adds to the player\'s carry weight. 0 = weightless (for documents, key items).'],
  'item-value': ['Value (Caps)', 'The base trade value in caps. Used by barter skill checks.'],
  'item-ap_cost': ['AP Cost', 'How many Action Points it costs to use this weapon in combat. Pistols: 2. Melee: 3. Rifles: 3.'],
  'item-damage_dice': ['Damage Dice', 'Dice roll for damage, e.g. "1d8" or "2d6". Roll happens each hit.'],
  'item-range_tiles': ['Range (tiles)', 'Maximum distance in grid tiles. Melee = 1. Pistols ~8. Rifles ~12.'],
  // Dialogue
  'node-type': ['Node Type', '"NPC Line" = the NPC speaks. "Player Choice" = the player picks from options. Conversations alternate between these.'],
  'node-text': ['Text', 'What the NPC says (for NPC Line nodes). Should sound like the character, not a game instruction.'],
  'node-next': ['Next Node', 'Which node to go to after this one. "END" closes the conversation.'],
  'choice-text': ['Choice Text', 'What the player can say. Start with [SkillName 50] for a skill check option.'],
  'choice-skill': ['Skill Required', 'For skill checks: which skill is tested (speech, intimidate, barter, etc.).'],
  'choice-difficulty': ['Difficulty', 'The minimum skill score needed to pass. Player has ~50 base in most skills.'],
  'trigger-flags_required': ['Flags Required', 'Comma-separated flag names. This conversation only shows if ALL these flags are set.'],
  'trigger-flags_excluded': ['Flags Excluded', 'Comma-separated flag names. This conversation is hidden if ANY of these flags are set.'],
  'on_complete-flags_set': ['Flags to Set', 'Comma-separated flags set when this conversation ends. Used to gate other events and quests.'],
  'on_complete-relationship': ['Relationship Change', 'How much to change the player\'s relationship with this NPC when the conversation ends. Positive = warmer.'],
  // Quest
  'quest-title': ['Quest Title', 'The name shown in the quest journal.'],
  'quest-summary': ['Summary', 'Brief description shown at the top of the journal entry.'],
  'stage-title': ['Stage Title', 'Shown in the journal when this stage is active.'],
  'objective-text': ['Objective Text', 'What the player needs to do, in plain English.'],
  'objective-flag_complete': ['Completion Flag', 'This objective is ticked off when this flag is set anywhere in the game (dialogue, combat, etc.).'],
};

function showHelp(key) {
  const h = HELP[key];
  if (!h) return;
  document.getElementById('help-title').textContent = h[0].toUpperCase();
  document.getElementById('help-body').textContent = h[1];
}

// Help is wired once via event delegation on the form panel (see initHelp), so it keeps
// working no matter how often the form re-renders. focusin bubbles (focus does not), and
// mouseover gives discoverable hover help too.
let _helpInited = false;
function initHelp() {
  if (_helpInited) return;
  _helpInited = true;
  const panel = document.getElementById('form-panel');
  const handler = e => {
    const el = e.target.closest ? e.target.closest('[data-help]') : null;
    if (el) showHelp(el.dataset.help);
  };
  panel.addEventListener('focusin', handler);
  panel.addEventListener('mouseover', handler);
}

// ═══════════════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  selectedId = null;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', TABS[i] === tab);
  });
  renderList();
  // The manifest is a singleton — open it straight away rather than make the user click.
  if (tab === 'campaign') { selectItem('__manifest__'); return; }
  document.getElementById('form-panel').innerHTML = '<div class="placeholder">Select an item from the left, or click &ldquo;+ Add New&rdquo;</div>';
}

// ═══════════════════════════════════════════════════════════════
//  LIST RENDERING
// ═══════════════════════════════════════════════════════════════
function renderList() {
  const container = document.getElementById('list-items');
  container.innerHTML = '';
  const items = getListItems();
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'list-item' + (item.id === selectedId ? ' selected' : '');
    div.innerHTML = `<strong>${esc(item.label)}</strong><small>${esc(item.sub || '')}</small>`;
    div.onclick = () => selectItem(item.id);
    container.appendChild(div);
  });
}

function getListItems() {
  switch (currentTab) {
    case 'campaign':
      return [{ id: '__manifest__', label: DB.manifest.name || 'Campaign Manifest', sub: DB.manifest.id }];
    case 'world':
      return (DB.world.nodes||[]).map(n => ({ id: n.id, label: n.display_name || n.id, sub: n.type }));
    case 'maps':
      return Object.values(DB.maps).map(m => ({ id: m.id, label: m.display_name || m.id, sub: `${m.width}×${m.height}` }));
    case 'perks':
      return Object.values(DB.perks).map(p => ({ id: p.id, label: p.name || p.id, sub: (p.effects||[]).length + ' effect(s)' }));
    case 'traits':
      return Object.values(DB.traits).map(t => ({ id: t.id, label: t.name || t.id, sub: (t.effects||[]).length + ' effect(s)' }));
    case 'factions':
      return Object.values(DB.factions).map(f => ({ id: f.id, label: f.name || f.id, sub: f.description?.slice(0,50) }));
    case 'items':
      const allItems = [...DB.items.weapons, ...DB.items.armor, ...DB.items.consumables, ...DB.items.misc];
      return allItems.map(i => ({ id: i.id, label: i.name || i.id, sub: i.type + (i.subtype ? ' / '+i.subtype : '') }));
    case 'locations':
      return Object.values(DB.locations).map(l => ({ id: l.id, label: l.name || l.id, sub: l.type }));
    case 'npcs':
      return Object.values(DB.npcs).map(n => ({ id: n.id, label: n.name || n.id, sub: n.faction || '' }));
    case 'quests':
      return Object.values(DB.quests).map(q => ({ id: q.id, label: q.title || q.id, sub: (q.stages||[]).length + ' stage(s)' }));
    case 'dialogue':
      return Object.values(DB.npcs).map(n => ({ id: n.id, label: n.name || n.id, sub: (DB.dialogues[n.id]?.conversations||[]).length + ' conversation(s)' }));
  }
  return [];
}

// ═══════════════════════════════════════════════════════════════
//  SELECTION + FORM RENDERING
// ═══════════════════════════════════════════════════════════════
function selectItem(id) {
  selectedId = id;
  if (currentTab === 'dialogue') dialogueNpcId = id;
  renderList();
  renderForm();
}

function renderForm() {
  const panel = document.getElementById('form-panel');
  switch (currentTab) {
    case 'campaign': panel.innerHTML = renderManifestForm(); break;
    case 'world': panel.innerHTML = renderWorldNodeForm(findWorldNode(selectedId)); break;
    case 'maps': panel.innerHTML = renderMapForm(DB.maps[selectedId]); break;
    case 'perks': panel.innerHTML = renderEffectCarrierForm('perks', DB.perks[selectedId]); break;
    case 'traits': panel.innerHTML = renderEffectCarrierForm('traits', DB.traits[selectedId]); break;
    case 'factions': panel.innerHTML = renderFactionForm(DB.factions[selectedId]); break;
    case 'items': panel.innerHTML = renderItemForm(findItem(selectedId)); break;
    case 'locations': panel.innerHTML = renderLocationForm(DB.locations[selectedId]); break;
    case 'npcs': panel.innerHTML = renderNpcForm(DB.npcs[selectedId]); break;
    case 'quests': panel.innerHTML = renderQuestForm(DB.quests[selectedId]); break;
    case 'dialogue': panel.innerHTML = renderDialogueTab(DB.npcs[selectedId]); break;
  }
  attachHelpListeners();
}

function attachHelpListeners() { initHelp(); }

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateFaction(id, key, val) {
  if (key === 'id') { DB.factions[val] = DB.factions[id]; DB.factions[val].id = val; delete DB.factions[id]; selectedId = val; renderList(); return; }
  DB.factions[id][key] = val;
}
function updateFactionThreshold(id, tier, val) {
  if (!DB.factions[id].rep_thresholds) DB.factions[id].rep_thresholds = {};
  DB.factions[id].rep_thresholds[tier] = val;
}
function updateFactionLabel(id, thresholdVal, label) {
  if (!DB.factions[id].rep_labels) DB.factions[id].rep_labels = {};
  DB.factions[id].rep_labels[String(thresholdVal)] = label;
}

function findItem(id) {
  for (const cat of ['weapons','armor','consumables','misc']) {
    const found = DB.items[cat].find(i => i.id === id);
    if (found) return found;
  }
  return null;
}
function findItemCategory(id) {
  for (const cat of ['weapons','armor','consumables','misc']) {
    if (DB.items[cat].find(i => i.id === id)) return cat;
  }
  return null;
}

function renderItemForm(item) {
  if (!item) return '<div class="placeholder">Select an item</div>';
  const cat = findItemCategory(item.id);
  return `
  <h2>ITEM — ${cat.toUpperCase()}</h2>
  <div class="form-row">
    <div class="form-group"><label>ID</label>
      <input type="text" value="${esc(item.id)}" onchange="updateItemId('${item.id}',this.value)">
    </div>
    <div class="form-group" style="flex:2"><label>Display Name</label>
      <input type="text" value="${esc(item.name)}" onchange="updateItem('${item.id}','name',this.value)" data-help="item-name">
    </div>
  </div>
  <div class="form-group"><label>Description</label>
    <textarea onchange="updateItem('${item.id}','description',this.value)" data-help="item-description">${esc(item.description||'')}</textarea>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Weight (kg)</label>
      <input type="number" step="0.1" value="${item.weight||0}" onchange="updateItem('${item.id}','weight',+this.value)" data-help="item-weight">
    </div>
    <div class="form-group"><label>Value (caps)</label>
      <input type="number" value="${item.value||0}" onchange="updateItem('${item.id}','value',+this.value)" data-help="item-value">

  </div>

  ${cat === 'armor' ? renderArmorFields(item) : ''}

  <div style="margin-top:20px">
    <button class="btn-danger" onclick="deleteItem('${item.id}')">Delete Item</button>

}

function renderWeaponFields(item) {

    <div class="form-group"><label>Skill Used</label>
      <select onchange="updateItem('${item.id}','skill_used',this.value)">

    </div>
    <div class="form-group"><label>Subtype</label>

      </select>

    <div class="form-group"><label>Ammo Type</label>

function renderArmorFields(item) {
  return `
  <div class="form-section-header">Armor Stats</div>
  <div class="form-row">
    <div class="form-group"><label>Defense Bonus</label>
      <input type="number" value="${item.defense_bonus||0}" onchange="updateItem('${item.id}','defense_bonus',+this.value)">
    </div>
    <div class="form-group"><label>Evasion Modifier</label>
      <input type="number" value="${item.evasion_mod||0}" onchange="updateItem('${item.id}','evasion_mod',+this.value)">
    </div>
  </div>`;
}

function renderConsumableFields(item) {
  const effects = item.effects || [];
  return `
  <div class="form-section-header">Effects</div>
  ${effects.map((e,i) => `
  <div class="form-row">
    <div class="form-group"><label>Type</label>
      <select onchange="updateItemEffect('${item.id}',${i},'type',this.value)">
        ${['heal_hp','remove_status','boost_ap_temp'].map(t => `<option ${e.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Value</label>
      <input type="number" value="${e.value||0}" onchange="updateItemEffect('${item.id}',${i},'value',+this.value)">
    </div>
    <div class="form-group" style="flex:0">
      <label>&nbsp;</label>
      <button class="btn-danger btn-small" onclick="removeItemEffect('${item.id}',${i})">✕</button>
    </div>
  </div>`).join('')}
  <button class="btn-primary btn-small" onclick="addItemEffect('${item.id}')">+ Add Effect</button>`;
}

function updateItem(id, key, val) {
  const item = findItem(id);
  if (item) { item[key] = val; }
}
function updateItemId(oldId, newId) {
  const cat = findItemCategory(oldId);
  const item = findItem(oldId);
  if (item) { item.id = newId; selectedId = newId; renderList(); }
}
function updateItemEffect(id, index, key, val) {
  const item = findItem(id);
  if (item && item.effects) item.effects[index][key] = val;
}
function addItemEffect(id) {
  const item = findItem(id);
  if (item) { if (!item.effects) item.effects = []; item.effects.push({type:'heal_hp',value:10}); renderForm(); }
}
function removeItemEffect(id, index) {
  const item = findItem(id);
  if (item && item.effects) { item.effects.splice(index,1); renderForm(); }
}

function updateLoc(id, key, val) { if (DB.locations[id]) DB.locations[id][key] = val; }
function updateLocationId(oldId, newId) { DB.locations[newId] = DB.locations[oldId]; DB.locations[newId].id = newId; delete DB.locations[oldId]; selectedId = newId; renderList(); }
function updateLocPos(id, axis, val) { if (!DB.locations[id].overworld_position) DB.locations[id].overworld_position = {x:0,y:0}; DB.locations[id].overworld_position[axis] = val; }
function updateLocNpcs(id, select) { DB.locations[id].npcs_present = Array.from(select.selectedOptions).map(o => o.value); }

function renderNpcForm(npc) {
  if (!npc) return '<div class="placeholder">Select an NPC</div>';
  const factionOptions = Object.keys(DB.factions).map(fid => `<option value="${esc(fid)}" ${npc.faction===fid?'selected':''}>${esc(DB.factions[fid].name||fid)}</option>`).join('');

  const cp = npc.combat_profile || {};
  const hasCombat = npc.combat_profile !== null && npc.combat_profile !== undefined;
  const vendor = npc.vendor || {};
  const hasVendor = npc.vendor !== null && npc.vendor !== undefined;
  return `
  <h2>NPC</h2>
  <div class="form-row">
    <div class="form-group"><label>ID</label>
      <input type="text" value="${esc(npc.id)}" onchange="updateNpcId('${npc.id}',this.value)">
    </div>
    <div class="form-group" style="flex:2"><label>Display Name</label>
      <input type="text" value="${esc(npc.name)}" onchange="updateNpc('${npc.id}','name',this.value)" data-help="npc-name">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Faction</label>
      <select onchange="updateNpc('${npc.id}','faction',this.value)" data-help="npc-faction">
        <option value="">— none —</option>${factionOptions}
      </select>
    </div>
    <div class="form-group"><label>Default Location</label>
      <select onchange="updateNpc('${npc.id}','location_default',this.value)" data-help="npc-location_default">
        <option value="">— none —</option>${locOptions}
      </select>
    </div>
  </div>
  <div class="form-group"><label>Role / Notes</label>
    <input type="text" value="${esc(npc.role||'')}" onchange="updateNpc('${npc.id}','role',this.value)" data-help="npc-role">
  </div>
  <div class="form-section-header">Stats</div>
  <div class="stat-row">
    ${['grit','reflex','mind','body','nerve','presence'].map(s => `
    <div class="stat-item">
      <label>${s}</label>
      <input type="number" min="1" max="10" value="${stats[s]||5}" onchange="updateNpcStat('${npc.id}','${s}',+this.value)" data-help="npc-stats-${s}">
    </div>`).join('')}

  <div class="form-section-header">Combat Profile</div>

  <div class="form-row">
    <div class="form-group"><label>Max HP</label>

    <div class="form-group"><label>AP per Turn</label>
      <input type="number" value="${cp.ap_per_turn||5}" onchange="updateNpcCombat('${npc.id}','ap_per_turn',+this.value)">

  <div class="form-row">
    <div class="form-group"><label>Weapon ID</label>
      <input type="text" value="${esc(cp.weapon_id||'')}" onchange="updateNpcCombat('${npc.id}','weapon_id',this.value)">
    </div>
    <div class="form-group"><label>Armor ID</label>
      <input type="text" value="${esc(cp.armor_id||'')}" onchange="updateNpcCombat('${npc.id}','armor_id',this.value)">

    <div class="form-group"><label>Price Markup (1.0 = base value)</label>

    </div>
    <div class="form-group">
      <label><input type="checkbox" ${vendor.buys!==false?'checked':''} onchange="updateNpcVendor('${npc.id}','buys',this.checked)" data-help="vendor-buys"> Buys items from the player</label>
    </div>
  </div>
  <p style="color:#666;font-size:12px">To open this shop, give one of the NPC's dialogue lines the "Opens trade/shop" option on the Dialogue tab.</p>` : ''}

    <button class="btn-danger" onclick="deleteItem('${npc.id}')">Delete NPC</button>

}

function updateNpc(id, key, val) { if (DB.npcs[id]) DB.npcs[id][key] = val; }
function updateNpcId(oldId, newId) { DB.npcs[newId] = DB.npcs[oldId]; DB.npcs[newId].id = newId; delete DB.npcs[oldId]; selectedId = newId; renderList(); }

function toggleCombatProfile(id, on) {

function updateNpcVendor(id, key, val) { if (!DB.npcs[id].vendor) DB.npcs[id].vendor = {sells:[],markup:1.0,buys:true}; DB.npcs[id].vendor[key] = val; }
function toggleVendor(id, on) {
  DB.npcs[id].vendor = on ? {sells:[],markup:1.0,buys:true} : null;
  renderForm();
}

      <div class="form-group"><label>Flags All (comma-sep)</label>
        <input type="text" value="${esc(((stage.completion_condition||{}).flags_all||[]).join(','))}"
          onchange="updateStageCompletion('${quest.id}',${si},this.value)">
      </div>
      <div class="form-group"><label>Next Stage ID</label>
        <input type="text" value="${esc((stage.on_complete||{}).next_stage||'')}"
          onchange="updateStageNextStage('${quest.id}',${si},this.value)">
      </div>
    </div>
    <div class="form-group"><label>Flags to Set on Complete (comma-sep)</label>
      <input type="text" value="${esc(((stage.on_complete||{}).flags_set||[]).join(','))}"
        onchange="updateStageFlagsSet('${quest.id}',${si},this.value)">
    </div>
    <button class="btn-danger btn-small" style="margin-top:8px" onclick="removeStage('${quest.id}',${si})">Remove Stage</button>
  </div>`).join('')}
  <button class="btn-primary" onclick="addStage('${quest.id}')">+ Add Stage</button>
  <div style="margin-top:16px">
    <button class="btn-danger" onclick="deleteItem('${quest.id}')">Delete Quest</button>
  </div>`;
}

function updateQuest(id, key, val) { if (DB.quests[id]) DB.quests[id][key] = val; }
function updateQuestId(oldId, newId) { DB.quests[newId] = DB.quests[oldId]; DB.quests[newId].id = newId; delete DB.quests[oldId]; selectedId = newId; renderList(); }
function updateStage(qid, si, key, val) { DB.quests[qid].stages[si][key] = val; }
function updateObjective(qid, si, oi, key, val) { DB.quests[qid].stages[si].objectives[oi][key] = val; }
function addObjective(qid, si) { DB.quests[qid].stages[si].objectives.push({id:'obj_new',text:'',flag_complete:''}); renderForm(); }
function removeObjective(qid, si, oi) { DB.quests[qid].stages[si].objectives.splice(oi,1); renderForm(); }
function addStage(qid) { DB.quests[qid].stages.push({id:'stage_new',title:'',description:'',objectives:[],completion_condition:{flags_all:[]},on_complete:{flags_set:[],next_stage:''}}); renderForm(); }
function removeStage(qid, si) { DB.quests[qid].stages.splice(si,1); renderForm(); }
function updateStageCompletion(qid,si,val) { DB.quests[qid].stages[si].completion_condition = {flags_all: val.split(',').map(s=>s.trim()).filter(Boolean)}; }
function updateStageNextStage(qid,si,val) { if (!DB.quests[qid].stages[si].on_complete) DB.quests[qid].stages[si].on_complete = {}; DB.quests[qid].stages[si].on_complete.next_stage = val||null; }
function updateStageFlagsSet(qid,si,val) { if (!DB.quests[qid].stages[si].on_complete) DB.quests[qid].stages[si].on_complete = {}; DB.quests[qid].stages[si].on_complete.flags_set = val.split(',').map(s=>s.trim()).filter(Boolean); }

// ═══════════════════════════════════════════════════════════════
//  DIALOGUE TAB
// ═══════════════════════════════════════════════════════════════
function renderDialogueTab(npc) {
  if (!npc) return '<div class="placeholder">Select an NPC from the list to edit their dialogue</div>';
  const dlg = DB.dialogues[npc.id] || {conversations:[]};
  const convos = dlg.conversations || [];
  return `
  <h2>DIALOGUE — ${esc(npc.name||npc.id)}</h2>
  <p style="color:#666;font-size:12px;margin-bottom:16px">Each conversation is a branching tree of nodes. NPC Lines auto-advance; Player Choices let the player pick an option.</p>
  ${convos.map((convo,ci) => renderConvoCard(npc.id, convo, ci)).join('')}
  <button class="btn-primary" onclick="addConversation('${npc.id}')">+ Add Conversation</button>`;
}

function renderConvoCard(npcId, convo, ci) {
  const nodes = convo.nodes || {};
  const trigger = convo.trigger_conditions || {};
  const onComplete = convo.on_complete || {};
  const nodeIds = Object.keys(nodes);
  const nodeOptions = ['END', ...nodeIds].map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join('');

  return `
  <div class="convo-card">
    <div class="convo-header" onclick="toggleConvo('convo-body-${ci}')">
      <span><strong>${esc(convo.id)}</strong> &nbsp;<small style="color:#555">${nodeIds.length} nodes</small></span>
      <span style="color:#555;font-size:12px">▼</span>
    </div>
    <div class="convo-body" id="convo-body-${ci}">
      <div class="form-row" style="margin-bottom:12px">
        <div class="form-group" style="flex:2"><label>Conversation ID</label>
          <input type="text" value="${esc(convo.id)}" onchange="updateConvoId('${npcId}',${ci},this.value)">
        </div>
        <div class="form-group"><label>Entry Node</label>
          <select onchange="updateConvoField('${npcId}',${ci},'entry_node',this.value)">
            ${nodeIds.map(id => `<option ${convo.entry_node===id?'selected':''}>${esc(id)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-section-header">Trigger Conditions</div>
      <div class="form-row">
        <div class="form-group"><label>Flags Required (comma-sep)</label>
          <input type="text" value="${esc((trigger.flags_required||[]).join(','))}"
            onchange="updateTrigger('${npcId}',${ci},'flags_required',this.value)" data-help="trigger-flags_required">
        </div>
        <div class="form-group"><label>Flags Excluded (comma-sep)</label>
          <input type="text" value="${esc((trigger.flags_excluded||[]).join(','))}"
            onchange="updateTrigger('${npcId}',${ci},'flags_excluded',this.value)" data-help="trigger-flags_excluded">
        </div>
      </div>
      <div class="form-section-header">Dialogue Nodes</div>
      ${nodeIds.map(nodeId => renderNodeCard(npcId, ci, nodeId, nodes[nodeId], nodeOptions)).join('')}
      <button class="add-node-btn" onclick="addNode('${npcId}',${ci},'npc_line')">+ Add NPC Line Node</button>
      <button class="add-node-btn" style="margin-top:4px" onclick="addNode('${npcId}',${ci},'player_choice')">+ Add Player Choice Node</button>
      <div class="on-complete-section">
        <div class="form-section-header" style="margin-top:0">On Complete</div>
        <div class="form-row">
          <div class="form-group"><label>Flags to Set (comma-sep)</label>
            <input type="text" value="${esc((onComplete.flags_set||[]).join(','))}"
              onchange="updateOnComplete('${npcId}',${ci},'flags_set',this.value)" data-help="on_complete-flags_set">
          </div>
          <div class="form-group"><label>Relationship Change</label>
            <input type="number" value="${onComplete.relationship_change||0}"
              onchange="updateOnComplete('${npcId}',${ci},'relationship_change',+this.value)" data-help="on_complete-relationship">
          </div>
        </div>
      </div>
      <button class="btn-danger btn-small" style="margin-top:10px" onclick="removeConversation('${npcId}',${ci})">Remove Conversation</button>
    </div>
  </div>`;
}

function renderNodeCard(npcId, ci, nodeId, node, nodeOptions) {
  const isChoice = node.type === 'player_choice';
  const choices = node.choices || [];
  return `
  <div class="node-card ${isChoice?'player-choice':'npc-line'}">
    <div class="node-type">${isChoice ? 'PLAYER CHOICE' : 'NPC LINE'} — ${esc(nodeId)}</div>
    ${!isChoice ? `
    <div class="form-group"><label>Speaker</label>
      <input type="text" value="${esc(node.speaker||'')}" onchange="updateNode('${npcId}',${ci},'${nodeId}','speaker',this.value)">
    </div>
    <div class="form-group"><label>Text</label>
      <textarea onchange="updateNode('${npcId}',${ci},'${nodeId}','text',this.value)" data-help="node-text">${esc(node.text||'')}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Next Node</label>
        <select onchange="updateNode('${npcId}',${ci},'${nodeId}','next',this.value==='END'?null:this.value)" data-help="node-next">
          ${nodeOptions.replace(`value="${nodeId}"`, '').replace(`<option value="${esc(node.next||'')}">`,`<option value="${esc(node.next||'')}" selected>`)}
        </select>
      </div>
      <div class="form-group"><label>Mid-Node Flags Set (comma-sep)</label>
        <input type="text" value="${esc((node.flags_set||[]).join(','))}" onchange="updateNode('${npcId}',${ci},'${nodeId}','flags_set',this.value.split(',').map(s=>s.trim()).filter(Boolean))">
      </div>
      <div class="form-group"><label>Relationship Change</label>
        <input type="number" value="${node.relationship_change||0}" onchange="updateNode('${npcId}',${ci},'${nodeId}','relationship_change',+this.value)">
      </div>
    </div>
    <div class="form-group">
      <label><input type="checkbox" ${node.open_shop?'checked':''} onchange="updateNode('${npcId}',${ci},'${nodeId}','open_shop',this.checked)" data-help="node-open_shop"> Opens this NPC's trade/shop screen when the player continues past this line</label>
    </div>` : `
    <div style="margin-bottom:6px;color:#666;font-size:12px">${choices.length} choice(s):</div>
    ${choices.map((c,chi) => `
    <div class="choice-row">
      <div class="form-group"><label>Choice Text</label>
        <input type="text" value="${esc(c.text||'')}" onchange="updateChoice('${npcId}',${ci},'${nodeId}',${chi},'text',this.value)" data-help="choice-text">
      </div>
      <div class="form-row">
        <div class="form-group"><label>Condition Type</label>
          <select onchange="updateChoiceCondType('${npcId}',${ci},'${nodeId}',${chi},this.value)">
            ${['none','skill_check','flag_required','flag_excluded','faction_rep_min'].map(t=>`<option ${(c.condition?c.condition.type:'none')===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        ${c.condition?.type==='skill_check' ? `
        <div class="form-group"><label>Skill</label>
          <select onchange="updateChoiceCond('${npcId}',${ci},'${nodeId}',${chi},'skill',this.value)" data-help="choice-skill">
            ${['speech','intimidate','barter','medicine','lockpick','tech','stealth','guns','melee'].map(s=>`<option ${c.condition.skill===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Difficulty</label>
          <input type="number" value="${c.condition.difficulty||50}" onchange="updateChoiceCond('${npcId}',${ci},'${nodeId}',${chi},'difficulty',+this.value)" data-help="choice-difficulty">
        </div>
        <div class="form-group"><label>On Fail Node</label>
          <select onchange="updateChoiceCond('${npcId}',${ci},'${nodeId}',${chi},'on_fail',this.value==='END'?null:this.value)">
            ${nodeOptions}
          </select>
        </div>` : ''}
        ${(c.condition?.type==='flag_required'||c.condition?.type==='flag_excluded') ? `
        <div class="form-group"><label>Flag</label>
          <input type="text" value="${esc(c.condition.flag||'')}" onchange="updateChoiceCond('${npcId}',${ci},'${nodeId}',${chi},'flag',this.value)">
        </div>` : ''}
        <div class="form-group"><label>Next Node</label>
          <select onchange="updateChoice('${npcId}',${ci},'${nodeId}',${chi},'next',this.value==='END'?null:this.value)">
            ${nodeOptions.replace(`<option value="${esc(c.next||'')}">`,`<option value="${esc(c.next||'')}" selected>`)}
          </select>
        </div>
        <div class="form-group" style="flex:0">
          <label>&nbsp;</label>
          <button class="btn-danger btn-small" onclick="removeChoice('${npcId}',${ci},'${nodeId}',${chi})">✕</button>
        </div>
      </div>
    </div>`).join('')}
    <button class="btn-primary btn-small" onclick="addChoice('${npcId}',${ci},'${nodeId}')">+ Add Choice</button>`}
    <div style="margin-top:8px">
      <button class="btn-danger btn-small" onclick="removeNode('${npcId}',${ci},'${nodeId}')">Remove Node</button>
    </div>
  </div>`;
}

function toggleConvo(id) { const el = document.getElementById(id); if(el) el.style.display = el.style.display==='none'?'':'none'; }

function updateConvoField(npcId, ci, key, val) { ensureDialogue(npcId); DB.dialogues[npcId].conversations[ci][key] = val; }
function updateConvoId(npcId, ci, val) { ensureDialogue(npcId); DB.dialogues[npcId].conversations[ci].id = val; renderForm(); }
function updateTrigger(npcId, ci, key, val) {
  ensureDialogue(npcId);
  if (!DB.dialogues[npcId].conversations[ci].trigger_conditions) DB.dialogues[npcId].conversations[ci].trigger_conditions = {};
  DB.dialogues[npcId].conversations[ci].trigger_conditions[key] = val.split(',').map(s=>s.trim()).filter(Boolean);
}
function updateOnComplete(npcId, ci, key, val) {
  ensureDialogue(npcId);
  if (!DB.dialogues[npcId].conversations[ci].on_complete) DB.dialogues[npcId].conversations[ci].on_complete = {};
  DB.dialogues[npcId].conversations[ci].on_complete[key] = key==='relationship_change' ? val : val.split(',').map(s=>s.trim()).filter(Boolean);
}
function updateNode(npcId, ci, nodeId, key, val) {
  ensureDialogue(npcId);
  if (!DB.dialogues[npcId].conversations[ci].nodes) DB.dialogues[npcId].conversations[ci].nodes = {};
  DB.dialogues[npcId].conversations[ci].nodes[nodeId][key] = val;
}
function updateChoice(npcId, ci, nodeId, chi, key, val) {
  DB.dialogues[npcId].conversations[ci].nodes[nodeId].choices[chi][key] = val;
}
function updateChoiceCondType(npcId, ci, nodeId, chi, type) {
  const choice = DB.dialogues[npcId].conversations[ci].nodes[nodeId].choices[chi];
  choice.condition = type === 'none' ? null : {type};
  if (type === 'skill_check') choice.condition = {type:'skill_check',skill:'speech',difficulty:50};
  renderForm();
}
function updateChoiceCond(npcId, ci, nodeId, chi, key, val) {
  const choice = DB.dialogues[npcId].conversations[ci].nodes[nodeId].choices[chi];
  if (choice.condition) choice.condition[key] = val;
}
function addChoice(npcId, ci, nodeId) {
  DB.dialogues[npcId].conversations[ci].nodes[nodeId].choices.push({id:'c_new',text:'',condition:null,next:null});
  renderForm();
}
function removeChoice(npcId, ci, nodeId, chi) {
  DB.dialogues[npcId].conversations[ci].nodes[nodeId].choices.splice(chi,1);
  renderForm();
}
function addNode(npcId, ci, type) {
  ensureDialogue(npcId);
  const nodes = DB.dialogues[npcId].conversations[ci].nodes;
  const nodeId = 'node_' + (Object.keys(nodes).length+1).toString().padStart(3,'0');
  nodes[nodeId] = type === 'npc_line'
    ? {type:'npc_line',speaker:'',text:'',next:null}
    : {type:'player_choice',choices:[]};
  renderForm();
}
function removeNode(npcId, ci, nodeId) {
  delete DB.dialogues[npcId].conversations[ci].nodes[nodeId];
  renderForm();
}
function addConversation(npcId) {
  ensureDialogue(npcId);
  const id = 'convo_' + Date.now();
  DB.dialogues[npcId].conversations.push({
    id, trigger_conditions:{flags_required:[],flags_excluded:[]},
    entry_node:'', nodes:{}, on_complete:{flags_set:[],relationship_change:0,faction_rep_change:{}}
  });
  renderForm();
}
function removeConversation(npcId, ci) {
  DB.dialogues[npcId].conversations.splice(ci,1);
  renderForm();
}
function ensureDialogue(npcId) {
  if (!DB.dialogues[npcId]) DB.dialogues[npcId] = {conversations:[]};
}

function allItemIds() {
  return [...DB.items.weapons, ...DB.items.armor, ...DB.items.consumables, ...DB.items.misc].map(i => i.id);
}
function weaponIds() { return DB.items.weapons.map(w => w.id); }
function itemDatalist(id) {
  return `<datalist id="${id}">${allItemIds().map(i => `<option value="${esc(i)}">`).join('')}</datalist>`;
}
function npcDatalist(id) {
  return `<datalist id="${id}">${Object.keys(DB.npcs).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
}

  <div class="form-row">

    </div>
    <div class="form-group" style="flex:2"><label>Author</label>
      <input type="text" value="${esc(m.author||'')}" onchange="updateManifest('author',this.value)">

  </div>
  <div class="form-group"><label>Description</label>
    <textarea onchange="updateManifest('description',this.value)">${esc(m.description||'')}</textarea>

      <input type="number" value="${ps.caps??25}" onchange="updateManifestStart('caps',+this.value)">
    </div>
    <div class="form-group"><label>Start Time (hour, 0-23)</label>

    <div class="stat-item"><label>${s}</label>

function updateManifest(key, val) {

}
function updateManifestStart(key, val) { DB.manifest.player_start[key] = val; }
function updateManifestStat(stat, val) { DB.manifest.player_start.stats[stat] = val; }
function updateManifestInv(i, key, val) { DB.manifest.player_start.inventory[i][key] = val; }
function addManifestInv() { DB.manifest.player_start.inventory.push({item_id:'',quantity:1,equipped:false}); renderForm(); }
function removeManifestInv(i) { DB.manifest.player_start.inventory.splice(i,1); renderForm(); }

// ═══════════════════════════════════════════════════════════════

function findWorldNode(id) { return (DB.world.nodes||[]).find(n => n.id === id); }
function renderWorldNodeForm(node) {
  if (!node) return '<div class="placeholder">Select a world node, or click “+ Add New”</div>';
  const targetOpts = Object.keys(DB.locations);
  const conns = node.connections || (node.connections = []);
  return `
  <h2>WORLD NODE</h2>
  <p style="color:#666;font-size:12px;margin-bottom:12px">A stop on the wasteland map. Its <b>id</b> should match a Location id so travelling there loads that location's map.</p>
  <div class="form-row">
    <div class="form-group"><label>ID</label>
      <input type="text" value="${esc(node.id)}" onchange="updateWorldNodeId('${node.id}',this.value)">
    </div>
    <div class="form-group" style="flex:2"><label>Display Name</label>

  <div class="form-row">
    <div class="form-group"><label>Type</label>
      <select onchange="updateWorldNode('${node.id}','type',this.value)">

      </select>
    </div>
    <div class="form-group"><label>Map X</label>
      <input type="number" value="${(node.position||{}).x||0}" onchange="updateWorldNodePos('${node.id}','x',+this.value)">

function ensureMapShape(map) {
  if (!Array.isArray(map.terrain)) map.terrain = [];
  const w = map.width, h = map.height;
  const rows = [];
  for (let r = 0; r < h; r++) {
    let row = map.terrain[r] || '';
    if (row.length < w) row = row + '.'.repeat(w - row.length);
    else if (row.length > w) row = row.slice(0, w);
    rows.push(row);
  }
  map.terrain = rows;
}
function setBrush(kind, value) { mapBrush = { kind, value }; renderForm(); }
function entitiesAt(map) {
  // "q,r" -> badge letter, for quick grid overlay lookup.
  const at = {};
  if (map.player_start) at[`${map.player_start.q},${map.player_start.r}`] = 'P';
  (map.actors||[]).forEach(a => at[`${a.q},${a.r}`] = a.type === 'enemy' ? 'E' : 'N');
  (map.containers||[]).forEach(c => at[`${c.q},${c.r}`] = 'C');
  (map.examine_spots||[]).forEach(e => at[`${e.q},${e.r}`] = '?');
  (map.exit_zones||[]).forEach(x => at[`${x.q},${x.r}`] = 'X');
  (map.props||[]).forEach(p => { const k=`${p.q},${p.r}`; if (!at[k]) at[k] = '•'; });
  return at;
}
function renderMapGrid(map) {
  ensureMapShape(map);
  const at = entitiesAt(map);
  let html = `<div class="map-grid" style="grid-template-columns:repeat(${map.width},22px)">`;
  for (let r = 0; r < map.height; r++) {
    for (let q = 0; q < map.width; q++) {
      const ch = map.terrain[r].charAt(q);
      const badge = at[`${q},${r}`];
      html += `<div class="map-cell" id="cell-${q}-${r}" style="background:${charColor(ch)}"
        onclick="paintCell(${q},${r})" title="(${q},${r})">${ch===' '?'':esc(ch)}${badge?`<span class="ent">${badge}</span>`:''}</div>`;
    }
  }
  return html + '</div>';
}

      <span class="swatch" style="background:${t.color}"></span>${t.char===' '?'∅':t.char}</div>`).join('');
  const ents = [
    ['player','◉ Player start'],['npc','N NPC'],['enemy','E Enemy'],['container','C Container'],

  ].map(([k,label]) =>
    `<div class="brush ${mapBrush.kind==='entity'&&mapBrush.value===k?'active':''}" onclick="setBrush('entity','${k}')">${esc(label)}</div>`).join('');
  return `<div class="map-toolbar">${terr}</div><div class="map-toolbar">${ents}</div>`;

function paintCell(q, r) {
  const map = DB.maps[selectedId];
  if (!map) return;
  if (mapBrush.kind === 'terrain') {
    const t = TERRAIN_PALETTE.find(t => t.id === mapBrush.value);
    const row = map.terrain[r];
    map.terrain[r] = row.substring(0,q) + t.char + row.substring(q+1);
    const cell = document.getElementById(`cell-${q}-${r}`);   // update in place — no full re-render
    if (cell) {
      cell.style.background = t.color;
      cell.firstChild ? null : null;
      cell.childNodes[0].nodeValue = t.char === ' ' ? '' : t.char;
    }
    return;
  }
  // Entity brushes mutate a list, then re-render the form.
  const v = mapBrush.value;
  if (v === 'player') { map.player_start = {q, r}; }
  else if (v === 'erase') { removeEntitiesAt(map, q, r); }
  else if (v === 'npc' || v === 'enemy') {
    map.actors = map.actors || [];
    const n = map.actors.length + 1;
    map.actors.push(v === 'enemy'
      ? {id:`enemy_${n}`, type:'enemy', npc_id:'', q, r, glyph:'E', color:'#cc3322', dead_flag:`enemy_${n}_dead`}
      : {id:`npc_${n}`,   type:'npc',   npc_id:'', q, r, glyph:'N', color:'#88bbee'});
  }
  else if (v === 'container') {
    map.containers = map.containers || [];
    const n = map.containers.length + 1;
    map.containers.push({id:`container_${n}`, q, r, glyph:'▫', color:'#aaaa44', opened_flag:`container_${n}_opened`, locked:false, loot_table:[]});
  }
  else if (v === 'examine') {
    map.examine_spots = map.examine_spots || [];
    const n = map.examine_spots.length + 1;
    map.examine_spots.push({id:`examine_${n}`, q, r, glyph:'?', color:'#aaaaaa', title:'', text:''});
  }
  else if (v === 'exit') {
    map.exit_zones = map.exit_zones || [];
    const n = map.exit_zones.length + 1;
    map.exit_zones.push({id:`exit_${n}`, q, r, w:1, h:1, target:'world'});
  }
  else if (v === 'prop') {
    map.props = map.props || [];
    map.props.push({prop:'crate', q, r});
  }
  renderForm();
}
function removeEntitiesAt(map, q, r) {
  ['actors','containers','examine_spots','exit_zones','props'].forEach(list => {
    if (map[list]) map[list] = map[list].filter(e => !(e.q === q && e.r === r));
  });
  if (map.player_start && map.player_start.q === q && map.player_start.r === r) delete map.player_start;
}
function updateMap(id, key, val) { if (DB.maps[id]) DB.maps[id][key] = val; }
function updateMapId(oldId, newId) { DB.maps[newId] = DB.maps[oldId]; DB.maps[newId].id = newId; delete DB.maps[oldId]; selectedId = newId; renderList(); }
function resizeMap(id, key, val) {
  const map = DB.maps[id];
  if (!map) return;
  map[key] = Math.max(4, val);
  ensureMapShape(map);
  renderForm();
}
function updateMapEntity(id, list, i, key, val) { DB.maps[id][list][i][key] = val; if (key==='q'||key==='r'||key==='type') renderForm(); }
function removeMapEntity(id, list, i) { DB.maps[id][list].splice(i,1); renderForm(); }
function addLoot(id, ci) { const c = DB.maps[id].containers[ci]; (c.loot_table||(c.loot_table=[])).push({item_id:'',quantity:1,chance:1.0}); renderForm(); }

    <div class="form-group"><label>Type</label>
      <select onchange="updateEffect('${kind}','${id}',${i},'type',this.value)">
        ${EFFECT_TYPES.map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    ${needsSubtype?`<div class="form-group"><label>Subtype</label>
      <select onchange="updateEffect('${kind}','${id}',${i},'subtype',this.value)">
        ${['all','guns','melee'].map(s=>`<option ${e.subtype===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    ${needsSkill?`<div class="form-group"><label>Skill</label>
      <select onchange="updateEffect('${kind}','${id}',${i},'skill',this.value)">
        ${SKILL_IDS.map(s=>`<option ${e.skill===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    ${needsStat?`<div class="form-group"><label>Stat</label>
      <select onchange="updateEffect('${kind}','${id}',${i},'stat',this.value)">
        ${STAT_IDS.map(s=>`<option ${e.stat===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    ${needsValue?`<div class="form-group" style="flex:0"><label>Value</label>
      <input type="number" value="${e.value||0}" onchange="updateEffect('${kind}','${id}',${i},'value',+this.value)"></div>`:''}
    <div class="form-group" style="flex:0"><label>&nbsp;</label>
      <button class="btn-danger btn-small" onclick="removeEffect('${kind}','${id}',${i})">✕</button></div>
  </div>`;
}
function carrierStore(kind) { return kind === 'perks' ? DB.perks : DB.traits; }
function mapToCsv(obj) { return Object.entries(obj||{}).map(([k,v]) => `${k}:${v}`).join(', '); }
function csvToMap(str) {
  const out = {};
  (str||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(pair => {
    const [k,v] = pair.split(':').map(s=>s.trim());
    if (k) out[k] = +v || 0;
  });
  return out;
}
function updateCarrier(kind, id, key, val) { carrierStore(kind)[id][key] = val; }
function updateCarrierId(kind, oldId, newId) { const s = carrierStore(kind); s[newId] = s[oldId]; s[newId].id = newId; delete s[oldId]; selectedId = newId; renderList(); }
function updateCarrierReq(id, key, val) { const p = DB.perks[id]; if (!p.requirements) p.requirements = {}; p.requirements[key] = val; }
function updateCarrierReqMap(id, key, csv) { const p = DB.perks[id]; if (!p.requirements) p.requirements = {}; p.requirements[key] = csvToMap(csv); }
function addEffect(kind, id) { const o = carrierStore(kind)[id]; (o.effects||(o.effects=[])).push({type:'skill_bonus',skill:'guns',value:5}); renderForm(); }
function updateEffect(kind, id, i, key, val) { carrierStore(kind)[id].effects[i][key] = val; if (key==='type') renderForm(); }
function removeEffect(kind, id, i) { carrierStore(kind)[id].effects.splice(i,1); renderForm(); }

// ═══════════════════════════════════════════════════════════════
//  ADD / DELETE
// ═══════════════════════════════════════════════════════════════
function addItem() {
  if (currentTab === 'campaign') { alert('The campaign manifest is a single file — edit it directly.'); return; }
  const id = prompt('Enter a unique ID (lowercase, underscores):');
  if (!id || !id.trim()) return;
  const cleanId = id.trim().replace(/\s+/g,'_').toLowerCase();
  switch (currentTab) {
    case 'world':
      DB.world.nodes.push({id:cleanId,display_name:'New Node',position:{x:400,y:300},type:'settlement',unlocked_by_default:true,unlock_flag:null,connections:[]});
      break;
    case 'maps': {
      const w = 16, h = 12;
      const terrain = [];
      for (let r=0;r<h;r++) terrain.push('.'.repeat(w));
      DB.maps[cleanId] = {id:cleanId,display_name:'New Map',width:w,height:h,vision_radius:7,player_start:{q:2,r:Math.floor(h/2)},actors:[],containers:[],examine_spots:[],exit_zones:[],props:[],terrain};
      break;
    }
    case 'perks':
      DB.perks[cleanId] = {id:cleanId,name:'New Perk',description:'',requirements:{level:1,stats:{},skills:{}},effects:[]};
      break;
    case 'traits':
      DB.traits[cleanId] = {id:cleanId,name:'New Trait',description:'',effects:[]};
      break;
    case 'factions':
      DB.factions[cleanId] = {id:cleanId,name:'New Faction',description:'',rep_starting:0,rep_thresholds:{hostile:-50,unfriendly:-20,neutral:0,friendly:30,trusted:60},rep_labels:{'-50':'Hostile','0':'Neutral','30':'Friendly'},color:'#888'};
      break;
    case 'items':
      const cat = prompt('Category: weapons / armor / consumables / misc') || 'misc';
      const validCat = ['weapons','armor','consumables','misc'].includes(cat) ? cat : 'misc';
      DB.items[validCat].push({id:cleanId,name:'New Item',type:validCat==='weapons'?'weapon':validCat==='armor'?'armor':validCat==='consumables'?'consumable':'misc',subtype:'',description:'',weight:1,value:10,effects:[]});
      break;
    case 'locations':
      DB.locations[cleanId] = {id:cleanId,name:'New Location',type:'settlement',description:'',overworld_position:{x:400,y:300},connections:[],travel_time_hours:{},npcs_present:[],interactables:[],combat_arena:null};
      break;
    case 'npcs':
      DB.npcs[cleanId] = {id:cleanId,name:'New NPC',faction:'',role:'',location_default:'',stats:{grit:5,reflex:5,mind:5,body:5,nerve:5,presence:5},skills_override:{},combat_profile:null,relationship:0};
      DB.dialogues[cleanId] = {conversations:[]};
      break;
    case 'quests':
      DB.quests[cleanId] = {id:cleanId,title:'New Quest',summary:'',stages:[]};
      break;
    case 'dialogue':
      alert('Use the NPCs tab to create NPCs first. Dialogue is managed per-NPC.'); return;
  }
  selectedId = cleanId;
  renderList();
  renderForm();
}

function deleteItem(id) {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  switch (currentTab) {
    case 'world': { const i = DB.world.nodes.findIndex(n=>n.id===id); if (i>=0) DB.world.nodes.splice(i,1); break; }
    case 'maps': delete DB.maps[id]; break;
    case 'perks': delete DB.perks[id]; break;
    case 'traits': delete DB.traits[id]; break;
    case 'factions': delete DB.factions[id]; break;
    case 'items':
      for (const cat of ['weapons','armor','consumables','misc']) {
        const i = DB.items[cat].findIndex(x => x.id === id);
        if (i >= 0) { DB.items[cat].splice(i,1); break; }
      }
      break;
    case 'locations': delete DB.locations[id]; break;
    case 'npcs': delete DB.npcs[id]; delete DB.dialogues[id]; break;
    case 'quests': delete DB.quests[id]; break;
  }
  selectedId = null;
  renderList();
  document.getElementById('form-panel').innerHTML = '<div class="placeholder">Item deleted.</div>';
}

// ═══════════════════════════════════════════════════════════════
//  IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════════
function importJSON() { document.getElementById('file-input').click(); }

function handleImport(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  let done = 0, names = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      try { importOne(JSON.parse(e.target.result), file.name); names.push(file.name); }
      catch(err) { names.push(file.name + ' (FAILED: ' + err.message + ')'); }
      if (++done === files.length) { renderList(); alert('Imported ' + files.length + ' file(s):\n' + names.join('\n')); }
    };
    reader.readAsText(file);
  });
  event.target.value = '';
}

// Auto-detect a content file by its shape and merge it into DB.
function importOne(data, filename) {
  // Order matters: a local_map also has a player_start ({q,r}), so detect maps/world
  // before the manifest (whose player_start carries stats/location/inventory).
  if (Array.isArray(data.terrain)) { DB.maps[data.id] = data; }      // local_map
  else if (Array.isArray(data.nodes)) { DB.world = data; }           // world.json
  else if (data.player_start) {                  // campaign.json manifest
    DB.manifest = data;
    campaignId = (data.id || 'my_game').trim();
    document.getElementById('campaign-id').value = campaignId;
  }
  else if (Array.isArray(data.perks)) { data.perks.forEach(p => DB.perks[p.id] = p); }
  else if (Array.isArray(data.traits)) { data.traits.forEach(t => DB.traits[t.id] = t); }
  else if (data.conversations) { DB.dialogues[filename.replace('.json','')] = data; }
  else if (data.rep_thresholds) { DB.factions[data.id] = data; }
  else if (data.type === 'settlement' || data.type === 'hostile_zone' || data.type === 'dungeon') { DB.locations[data.id] = data; }
  else if (data.stats?.grit !== undefined) { DB.npcs[data.id] = data; }
  else if (data.stages) { DB.quests[data.id] = data; }
  else if (data.weapons) { data.weapons.forEach(i => DB.items.weapons.push(i)); }
  else if (data.armor) { data.armor.forEach(i => DB.items.armor.push(i)); }
  else if (data.consumables) { data.consumables.forEach(i => DB.items.consumables.push(i)); }
  else if (data.misc) { data.misc.forEach(i => DB.items.misc.push(i)); }
  else throw new Error('unrecognized file shape');
}

// Reset every collection to empty — used before importing a whole campaign folder so the
// new campaign replaces (rather than merges into) whatever was loaded.
function resetDB() {
  DB.manifest = { id:'my_game', name:'New Campaign', version:'0.1.0', author:'Your Name', description:'',
    player_start:{ name:'Wanderer', location:'', stats:{grit:5,reflex:5,mind:5,body:5,nerve:5,presence:5}, inventory:[], caps:25, time_hours:8 },
    default_unarmed_weapon:'' };
  DB.factions = {}; DB.items = { weapons:[], armor:[], consumables:[], misc:[] };
  DB.locations = {}; DB.maps = {}; DB.npcs = {}; DB.dialogues = {}; DB.quests = {};
  DB.perks = {}; DB.traits = {}; DB.world = { nodes: [] };
}

// Import an entire campaign folder at once (Chromium/Edge/Firefox support webkitdirectory).
function importFolder() { document.getElementById('folder-input').click(); }
function handleFolderImport(event) {
  const files = Array.from(event.target.files || []).filter(f => f.name.endsWith('.json'));
  event.target.value = '';
  if (!files.length) { alert('No .json files found in that folder. Pick a campaign folder (the one containing campaign.json).'); return; }
  if (!confirm(`Import ${files.length} JSON file(s) as a campaign?\nThis REPLACES the editor's current contents.`)) return;
  Promise.all(files.map(f => f.text().then(txt => ({ name: f.name, path: f.webkitRelativePath || f.name, txt }))))
    .then(entries => {
      resetDB();
      const problems = [];
      for (const e of entries) {
        try { importOne(JSON.parse(e.txt), e.name); }
        catch (err) { problems.push(`${e.path} — ${err.message}`); }
      }
      if (DB.manifest && DB.manifest.id) {
        campaignId = DB.manifest.id;
        document.getElementById('campaign-id').value = campaignId;
      }
      renderList();
      switchTab('campaign');
      alert(`Imported campaign "${campaignId}" — ${entries.length - problems.length}/${entries.length} files loaded.`
        + (problems.length ? `\n\nSkipped:\n${problems.join('\n')}` : ''));
    });
}

function exportAll() {
  const root = `campaigns/${campaignId}`;
  const files = {};
  const J = o => JSON.stringify(o, null, '\t');

  files[`${root}/campaign.json`] = J(DB.manifest);
  if ((DB.world.nodes||[]).length) files[`${root}/world.json`] = J(DB.world);
  Object.values(DB.factions).forEach(f => { files[`${root}/factions/${f.id}.json`] = J(f); });
  Object.values(DB.locations).forEach(l => { files[`${root}/locations/${l.id}.json`] = J(l); });
  Object.values(DB.maps).forEach(m => { ensureMapShape(m); files[`${root}/local_maps/${m.id}.json`] = J(m); });
  Object.values(DB.npcs).forEach(n => { files[`${root}/npcs/${n.id}.json`] = J(n); });
  Object.keys(DB.dialogues).forEach(npcId => { files[`${root}/npcs/dialogues/${npcId}.json`] = J(DB.dialogues[npcId]); });
  Object.values(DB.quests).forEach(q => { files[`${root}/quests/${q.id}.json`] = J(q); });
  files[`${root}/items/weapons.json`] = J({weapons: DB.items.weapons});
  files[`${root}/items/armor.json`] = J({armor: DB.items.armor});
  files[`${root}/items/consumables.json`] = J({consumables: DB.items.consumables});
  files[`${root}/items/misc.json`] = J({misc: DB.items.misc});
  files[`${root}/perks/perks.json`] = J({perks: Object.values(DB.perks)});
  files[`${root}/traits/traits.json`] = J({traits: Object.values(DB.traits)});

  const bundle = {_export_info: `ETT campaign export for "${campaignId}". Each key under "files" is a path; write its string value to that path in your project, then put "${campaignId}" in campaigns/active.txt.`, files};
  const blob = new Blob([JSON.stringify(bundle, null, '\t')], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${campaignId}_export_` + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  alert(`Exported campaign "${campaignId}" — ${Object.keys(files).length} files in the bundle.\n\nTo use: open the downloaded file and write each entry under "files" to its path in your project, then set campaigns/active.txt to "${campaignId}".`);
}

function saveToLocal() {
  const snapshot = JSON.stringify({campaignId, manifest:DB.manifest, world:DB.world, factions:DB.factions, items:DB.items, locations:DB.locations, maps:DB.maps, npcs:DB.npcs, dialogues:DB.dialogues, quests:DB.quests, perks:DB.perks, traits:DB.traits});
  localStorage.setItem('ett_editor_data', snapshot);
  alert('Saved to browser storage. Your work will persist if you reopen this file in the same browser.');
}

function loadFromLocal() {
  const saved = localStorage.getItem('ett_editor_data');
  if (!saved) { alert('No saved data found.'); return; }
  try {
    restoreSnapshot(JSON.parse(saved));
    renderList();
    document.getElementById('form-panel').innerHTML = '<div class="placeholder">Data loaded from local storage.</div>';
    alert('Loaded successfully.');
  } catch(e) { alert('Failed to load: ' + e.message); }
}

// Merge a saved snapshot into DB, pulling campaignId out of the payload so it doesn't
// pollute DB, and tolerating older snapshots that lack the newer collections.
function restoreSnapshot(data) {
  if (data.campaignId) { campaignId = data.campaignId; const el = document.getElementById('campaign-id'); if (el) el.value = campaignId; }
  ['manifest','world','factions','items','locations','maps','npcs','dialogues','quests','perks','traits'].forEach(k => {
    if (data[k] !== undefined) DB[k] = data[k];
  });
}

// ═══════════════════════════════════════════════════════════════
//  INITIAL LOAD — populate from game's data files if available
// ═══════════════════════════════════════════════════════════════
// (In browser, we can't access the filesystem directly. Users import files manually.)
// Show starter message on load.
window.addEventListener('load', () => {
  const saved = localStorage.getItem('ett_editor_data');
  if (saved) {
    try { restoreSnapshot(JSON.parse(saved)); renderList(); }
    catch(e) {}
  }
});
</script>
