<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitty Tanks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="1200" height="640"></canvas>

    <!-- Lobby overlay -->
    <div id="lobby" class="overlay">
      <div class="overlay-box">
        <div class="title-art">KITTY TANKS</div>
        <div class="subtitle">A Game of Feline Warfare</div>
        <div id="lobby-status">Connecting to server...</div>
        <div id="lobby-info" class="hidden">
          <div id="player-label"></div>
          <div id="share-url" class="url-box hidden"></div>
        </div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover" class="overlay hidden">
      <div class="overlay-box">
        <div id="winner-text" class="win-text"></div>
        <div id="winner-sub"></div>
        <div class="btn-row">
          <button id="rematch-btn" onclick="window.game && window.game.requestRematch()">Play Again!</button>
        </div>
        <div id="waiting-rematch" class="hidden muted">Waiting for opponent...</div>
      </div>
    </div>

    <!-- Disconnected overlay -->
    <div id="disconnected" class="overlay hidden">
      <div class="overlay-box">
        <div class="title-art">Oh no!</div>
        <div id="disconnect-msg">Connection lost.</div>
        <div class="btn-row">
          <button onclick="window.location.reload()">Reconnect</button>
        </div>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="chat-messages"></div>
  </div>

  <script src="js/network.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
