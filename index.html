<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Descent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="container">
    <canvas id="game"></canvas>
    <div id="touch-controls">
      <div id="dpad">
        <button class="dpad-btn" id="btn-up">▲</button>
        <button class="dpad-btn" id="btn-left">◀</button>
        <button class="dpad-btn" id="btn-right">▶</button>
        <button class="dpad-btn" id="btn-down">▼</button>
      </div>
      <div id="action-btns">
        <button class="action-btn" id="btn-sword">⚔</button>
        <button class="action-btn" id="btn-shoot">✦</button>
        <button class="action-btn" id="btn-dodge">◎</button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
